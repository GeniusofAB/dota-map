<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="Карта мира Dota 2 с героями и координатами.">
  <title>Dota 2 — The Terrene Plane</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23282e40'/%3E%3Cpath d='M16 5a8 8 0 0 0-8 8c0 6 8 14 8 14s8-8 8-14a8 8 0 0 0-8-8Z' fill='%23b6c7ff'/%3E%3Ccircle cx='16' cy='13' r='3' fill='%23282e40'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="heroes.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <section id="viewport" class="viewport" tabindex="0" aria-label="Карта. Перетаскивание перемещает карту, колесо мыши или жест двумя пальцами меняет масштаб, клик выбирает координаты. С клавиатуры: стрелки, плюс, минус и Home.">
      <div id="map-world" class="map-world"></div>
      <div id="markers" class="markers"></div>
      <div id="selection" class="selection" hidden aria-hidden="true"><span></span></div>
      <div id="map-status" class="loading" role="status" aria-label="Загрузка карты"><span class="spinner" aria-hidden="true"></span></div>
      <div class="map-controls" role="toolbar" aria-label="Управление картой">
        <button id="show-heroes" class="icon-button tonal" type="button" aria-label="Показать метки героев" aria-pressed="true" title="Метки героев">
          <svg class="pins-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-7.1 8-14A8 8 0 0 0 4 8c0 6.9 8 14 8 14Z"/><circle cx="12" cy="8" r="2.5"/></svg>
          <svg class="pins-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M6.5 6.5A7.8 7.8 0 0 0 4 12c1.3 2.9 4.5 5 8 5 1.3 0 2.6-.3 3.7-.8M9.4 7.3A8.6 8.6 0 0 1 12 7c3.5 0 6.7 2.1 8 5a9.4 9.4 0 0 1-2.2 2.9"/></svg>
        </button>
        <div class="zoom-controls" role="group" aria-label="Масштаб">
          <button id="zoom-in" class="icon-button" type="button" aria-label="Приблизить" title="Приблизить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="zoom-out" class="icon-button" type="button" aria-label="Отдалить" title="Отдалить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        </div>
        <button id="fit-map" class="icon-button" type="button" aria-label="Показать всю карту" title="Вся карта"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button>
      </div>
    </section>
    <aside class="details" aria-label="Выбранный герой и координаты">
      <div id="hero-search" class="hero-search" role="search">
        <div class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="hero-search-input" type="search" placeholder="Поиск героя" aria-label="Поиск героя" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="hero-search-results" autocomplete="off" spellcheck="false">
        </div>
        <ul id="hero-search-results" class="search-results" role="listbox" aria-label="Найденные герои" hidden></ul>
        <span id="hero-search-status" class="sr-only" role="status"></span>
      </div>
      <div id="empty-state" class="empty-state" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/><circle cx="12" cy="12" r="1"/></svg></div>
      <div id="point-details" hidden aria-live="polite">
        <h1 id="point-name" hidden></h1>
        <div class="pos-block"><code id="pos-value"></code><button id="copy-pos" class="icon-button copy-button" type="button" aria-label="Копировать координаты" title="Копировать [lat, lng]"><svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V4H4v11h4"/></svg><svg class="done-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button></div>
        <dl class="coordinates"><div><dt>lat</dt><dd id="lat-value"></dd></div><div><dt>lng</dt><dd id="lng-value"></dd></div></dl>
        <dl class="coordinates pixel-coordinates"><div><dt>X</dt><dd id="x-value"></dd></div><div><dt>Y</dt><dd id="y-value"></dd></div></dl>
        <span id="copy-status" class="sr-only" role="status"></span>
      </div>
      <p id="map-error" class="error" role="alert" hidden></p>
      <noscript><p>Для карты нужен JavaScript.</p></noscript>
    </aside>
  </main>
</body>
</html>
